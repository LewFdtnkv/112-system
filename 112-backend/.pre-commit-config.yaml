minimum_pre_commit_version: "4.0.0"
default_stages: [pre-commit]
exclude: ^(\.venv/|\.uv-cache/|\.ruff_cache/|\.pytest_cache/)

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check --offline
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check --fix
        entry: uv run --locked ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]

      - id: check-merge-conflict
        name: check merge conflict markers
        entry: uv run --locked check-merge-conflict --assume-in-merge
        language: system
        types: [text]

      - id: check-added-large-files
        name: check large files (1 MiB)
        entry: uv run --locked check-added-large-files --maxkb=1024
        language: system

      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        files: ^(app/|tests/|alembic/|alembic\.ini$|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
        require_serial: true
