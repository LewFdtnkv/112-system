[project]
name = "system112-backend"
version = "0.1.0"
description = "Starter backend for the System-112 training simulator"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pre-commit>=4,<5",
    "pre-commit-hooks>=5,<7",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
