name: system112-backend

x-backend: &backend
  build: .
  environment: &backend-environment
    APP_NAME: ${APP_NAME:-System-112 API}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@db:5432/${POSTGRES_DB:-trainer}
    SQL_ECHO: ${SQL_ECHO:-false}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
    REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
    LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    LLM_BASE_URL: http://llm:11434
    TELEPHONY_ENABLED: ${TELEPHONY_ENABLED:-false}
    ARI_PASSWORD: ${ARI_PASSWORD:-}
    TELEPHONY_ADAPTER_TOKEN: ${TELEPHONY_ADAPTER_TOKEN:-}
    SPEECH_GENERATOR_TOKEN: ${SPEECH_GENERATOR_TOKEN:-}
    TELEPHONY_SIP_DOMAIN: ${SIP_PUBLIC_ADDRESS:-localhost}
    TELEPHONY_WS_URL: ${TELEPHONY_WS_URL:-/sip-ws}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
    LLM_THREADS: ${LLM_THREADS:-2}
    SEMANTIC_ASSESSMENT_ENABLED: ${SEMANTIC_ASSESSMENT_ENABLED:-true}
    ASSESSMENT_RAG_ENABLED: ${ASSESSMENT_RAG_ENABLED:-true}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    ASSESSMENT_MODEL: ${ASSESSMENT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    LEARNING_RECOMMENDATIONS_ENABLED: ${LEARNING_RECOMMENDATIONS_ENABLED:-true}
    RECOMMENDATION_MODEL: ${RECOMMENDATION_MODEL:-qwen3:4b-instruct-2507-q4_K_M}

services:
  asterisk:
    profiles: [telephony]
    build: ./telephony/asterisk
    environment:
      ARI_PASSWORD: ${ARI_PASSWORD:-}
      SIP_PUBLIC_ADDRESS: ${SIP_PUBLIC_ADDRESS:-127.0.0.1}
      SIP_LOCAL_NET: ${SIP_LOCAL_NET:-auto}
    ports:
      - "${SIP_BIND_ADDRESS:-127.0.0.1}:5060:5060/udp"
      - "${SIP_BIND_ADDRESS:-127.0.0.1}:10000-10100:10000-10100/udp"
    volumes:
      - asterisk_data:/var/lib/asterisk
      - telephony_media:/srv/training:ro
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1

  telephony-worker:
    <<: *backend
    profiles: [telephony]
    command: ["python", "-m", "app.services.telephony.worker"]
    volumes:
      - telephony_media:/home/appuser/telephony
    depends_on:
      migrate:
        condition: service_completed_successfully
      asterisk:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1

  llm:
    image: ollama/ollama:0.34.2
    environment:
      # llama-server otherwise retains up to 8 GiB of old prompt states in RAM.
      # Keep the current request's KV cache, but disable the cross-request cache.
      LLAMA_ARG_CACHE_RAM: ${LLM_PROMPT_CACHE_MB:-0}
      OLLAMA_NUM_PARALLEL: ${LLM_PARALLEL_REQUESTS:-1}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "60s"
      OLLAMA_NO_CLOUD: "1"
    mem_limit: ${LLM_MEMORY_LIMIT:-4g}
    cpus: ${LLM_CPUS:-2}
    volumes:
      - llm_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.services.generation_worker"]
    mem_limit: 512m
    cpus: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      llm:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    build: ../112-frontend
    env_file:
      - path: ../112-frontend/.env
        required: false
    environment:
      SYSTEM112_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  db:
    cpus: ${DB_CPUS:-4}
    build: ./docker/postgres
    image: system112-postgres:17-pgvector0.8.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    cpus: ${API_CPUS:-4}
    environment:
      <<: *backend-environment
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      YANDEX_TRANSLATE_API_KEY: ${YANDEX_TRANSLATE_API_KEY:-}
      YANDEX_CLOUD_FOLDER_ID: ${YANDEX_CLOUD_FOLDER_ID:-}
      EXTERNAL_SERVICES_TIMEOUT_SECONDS: ${EXTERNAL_SERVICES_TIMEOUT_SECONDS:-8}
    volumes:
      - request_logs:/home/appuser/logs
      - telephony_media:/home/appuser/telephony
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  asterisk_data:
  telephony_media:
  llm_models:
  request_logs:
  postgres_data:
