server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    set $api_backend api:8000;

    location = /sip-ws {
        resolver 127.0.0.11 valid=10s;
        set $sip_backend asterisk:8088;
        proxy_pass http://$sip_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads share the API headers and upstream, with a smaller body limit.
        location ~ ^/api/v1/(users/me/photo|admin/users/[^/]+/photo|admin/classifiers/import|telephony/cues/[^/]+/wav|telephony/recordings|telephony-adapter/speech/[^/]+/wav)$ {
            client_max_body_size 1m;
            proxy_pass http://$api_backend;
        }
    }

    # Hashed build files must never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /map-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
